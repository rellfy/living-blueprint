[package]
name = "living-blueprint"
version = "0.0.4"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
derive-getters = "0.5.0"
env_logger = "0.11"
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }
notify = "8"
parley = "0.12"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.26.13"
tree-sitter-typescript = "0.23.2"
vello = "0.11"
wgpu = "30.0.1"
winit = "0.30.8"

[profile.release]
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
