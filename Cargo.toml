[package]
name = "living-blueprint"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A semantically zoomable, living blueprint of a git repository"
license = "MIT"
repository = "https://github.com/rellfy/living-blueprint"
readme = "README.md"
keywords = ["code", "visualization", "git", "tree-sitter", "agent"]
categories = ["development-tools", "visualization"]
exclude = [".github", ".living-blueprint", "CLAUDE.md", "AGENTS.md", "img.png"]

[dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
derive-getters = "0.5.0"
env_logger = "0.11"
fontique = { version = "0.12", default-features = false, features = ["fontconfig-dlopen"] }
notify = "8"
parley = "0.12"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.26.13"
tree-sitter-go = "0.25.0"
tree-sitter-highlight = "0.26.13"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-tags = "0.26.13"
tree-sitter-typescript = "0.23.2"
vello = "0.11"
wgpu = "30.0.1"
winit = "0.30.8"

[profile.release]
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
